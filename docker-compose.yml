# Postgres for the durable workflows (DBOS). The app itself runs with `npm run dev`, or see the
# Dockerfile. Set DBOS_SYSTEM_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/testsp_dbos
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - testsp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10

volumes:
  testsp-postgres:
